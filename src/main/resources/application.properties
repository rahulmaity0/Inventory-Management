server.port=8082
spring.application.name=inventory-billing-backend
spring.datasource.url=jdbc:h2:mem:inventorydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# ---- gold price ----------------------------------------------------------
# Used as-is when no API key is set, and as the fallback if the provider is
# down. Rupees per gram.
gold.price.static=16000
gold.price.currency=INR
gold.refresh-millis=1800000

# Leave these empty to stay on the static price. To go live, sign up with a
# provider (GoldAPI.io, metals-api, metalpriceapi), put the key here, and keep
# this file out of git.
gold.api.url=
gold.api.key=
gold.api.price-field=price_gram_24k
